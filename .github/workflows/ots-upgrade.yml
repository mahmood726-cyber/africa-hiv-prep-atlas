name: OTS upgrade calendar stamps to Bitcoin proofs

# Calendar-stamped .ots files (from ots-on-tag.yml) become Bitcoin-block-confirmed
# ~24h after stamping when the calendar server's commitment lands in a Bitcoin block.
# This workflow runs `ots upgrade` daily — it's idempotent (no-op if already upgraded
# or if Bitcoin confirmation not yet available) and only commits when a proof
# actually changes from calendar-only to Bitcoin-confirmed.

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — gives ~24h drift coverage for any stamp committed
    # within the prior 24h window.
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  ots-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opentimestamps-client
        run: pip install "opentimestamps-client>=0.7.2"

      - name: Upgrade .ots files in place
        shell: bash
        run: |
          if ! ls .ots/*.ots > /dev/null 2>&1; then
            echo "No .ots files in .ots/ — nothing to upgrade"
            exit 0
          fi
          for f in .ots/*.ots; do
            echo "--- $f ---"
            # ots upgrade is idempotent: returns 0 + no file change when already
            # upgraded or when calendar hasn't yet posted a Bitcoin attestation.
            # Only mutates the file when a NEW Bitcoin attestation is available.
            ots upgrade "$f" || echo "  (upgrade returned non-zero; continuing)"
          done

      - name: Commit and push any upgraded proofs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ots/
          if git diff --cached --quiet; then
            echo "No .ots upgrades available yet (Bitcoin confirmation pending)"
          else
            UPGRADED=$(git diff --cached --name-only | tr '\n' ' ')
            git commit -m "chore(ots): upgrade calendar stamps to Bitcoin proofs

Files upgraded: ${UPGRADED}

These .ots proofs now carry a Bitcoin block attestation. Verify any
proof at any time with: ots verify <file>.ots <original-file>"
            git push origin master
          fi
