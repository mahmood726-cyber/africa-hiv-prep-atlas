name: OTS stamp prereg and release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "prereg-*"
      - "v*"

permissions:
  contents: write

jobs:
  ots-stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opentimestamps-client
        run: pip install "opentimestamps-client>=0.7.2"

      - name: Stamp artifacts (idempotent)
        shell: bash
        run: |
          mkdir -p .ots
          stamp_if_missing() {
            if [ -f "$1" ] && [ ! -f "$2" ]; then
              ots stamp "$1"
              mv "$1.ots" "$2"
              echo "Stamped: $1 -> $2"
            elif [ ! -f "$1" ]; then
              echo "Skip (missing source): $1"
            else
              echo "Skip (already stamped): $2"
            fi
          }
          stamp_if_missing prereg/v0.0.1/spec.md .ots/prereg-v0.0.1-spec.md.ots
          stamp_if_missing prereg/v0.1.0-amend-1/spec.md .ots/prereg-v0.1.0-amend-1-spec.md.ots
          stamp_if_missing prereg/v0.1.0-amend-1/atlas.csv .ots/prereg-v0.1.0-amend-1-atlas.csv.ots
          stamp_if_missing prereg/v0.1.0/spec.md .ots/v0.1.0-prereg-spec.md.ots
          stamp_if_missing prereg/v0.1.0/atlas.csv .ots/v0.1.0-atlas.csv.ots
          stamp_if_missing prereg/v0.1.0/dashboard.html .ots/v0.1.0-dashboard.html.ots
          ls -la .ots/

      - name: Commit and push .ots files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ots/
          if git diff --cached --quiet; then
            echo "No new .ots files to commit"
          else
            git commit -m "chore(ots): stamp prereg artifacts via GitHub Actions"
            git push origin master
          fi
